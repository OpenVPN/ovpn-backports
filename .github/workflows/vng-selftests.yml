---
name: virtme-ng x86_64 selftests

"on":
  workflow_dispatch:
    inputs:
      distros:
        description: JSON array of distro targets to run.
        required: false
        type: string
        default: >-
          ["debian-10","debian-11","debian-12","debian-13",
          "void-6.6","void-6.18",
          "ubuntu-20.04","ubuntu-22.04","ubuntu-24.04",
          "ubuntu-25.10","ubuntu-26.04","fedora-44",
          "rhel-8","rhel-9","rhel-10","centos-stream-10",
          "opensuse-leap-15.6","opensuse-tumbleweed"]
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

jobs:
  vng-selftests:
    uses: mandelbitdev/kmod-ci/.github/workflows/out-of-tree-vng.yml@main
    with:
      cache-prefix: ovpn-backports
      distros: >-
        ${{
        inputs.distros ||
        '["debian-10","debian-11","debian-12","debian-13","void-6.6","void-6.18","ubuntu-20.04","ubuntu-22.04","ubuntu-24.04","ubuntu-25.10","ubuntu-26.04","fedora-44","rhel-8","rhel-9","rhel-10","centos-stream-10","opensuse-leap-15.6","opensuse-tumbleweed"]'
        }}
      guest-script: ci/run-selftests.sh
      prepare-command: ./backports-ctl.sh get-ovpn -t
    secrets:
      RHEL_ORG_ID: ${{ secrets.RHEL_ORG_ID }}
      RHEL_ACTIVATION_KEY: ${{ secrets.RHEL_ACTIVATION_KEY }}
      RHEL_10_BETA_X86_64_PRODUCT_CERT: ${{ secrets.RHEL_10_BETA_X86_64_PRODUCT_CERT }}
